name: tests
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      PYTHON_DOTENV_DISABLED: '1'
      DEEPSEEK_API_KEY: ''
      JWT_SECRET_KEY: isolated-d2-r1-test-only
      PYTHONPATH: tests
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: offline_unused
      MYSQL_PASSWORD: offline_unused
      MYSQL_DB: offline_unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_seed_example.py tests/test_d2_r1_demo.py tests/test_d3_r2_r2_rules.py tests/test_d3_r2_r3_retrieval.py tests/test_demo_rules_http.py tests/test_ai_tools.py tests/test_rule_boundary.py
      - run: python tests/run_release_http_smoke.py
